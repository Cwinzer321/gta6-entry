<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0f19">
<meta name="description" content="Vice City: Open World Crime. 2D top-down action crime game with driving, police wanted levels, weapons, and missions.">
<title>Vice City: Open World Crime</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0f19;
    color: #f8fafc;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  #game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    outline: none;
  }
  /* Screen-reader live announcement region (read aloud, visually hidden) */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    border: 0;
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" role="application" aria-label="Vice City: Open World Crime. 2D top-down action game with vehicle driving, police wanted levels, and crime missions." tabindex="0"></canvas>
<p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
